<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="nen_chinh">
      <div class="header">
        <h1>TETRIS</h1>
      </div>
      <div class="game">
        <!-- cấp độ -->
        <div class="capdo">
          <span>Cấp độ: </span>
          <div id="chon_level">
            <button class="level" data-level="1">1</button>
            <button class="level" data-level="2">2</button>
            <button class="level" data-level="3">3</button>
            <button class="level" data-level="4">4</button>
            <button class="level" data-level="5">5</button>
            <button class="level" data-level="6">6</button>
            <button class="level" data-level="7">7</button>
          </div>
        </div>
        <!-- màn hình chơi -->
        <div class="home">
          <div id="manhinhchinh"></div>
        </div>
        <div class="thongtingame">
          <div class="manhinhphu"></div>
          <div class="menuphu">
            <div class="diemso">Điểm: <span id="diemhientai">0 </span></div>
            <div class="dieu_khien">
              <div class="nutdieukhien">
                <button id="nutBatDau">Bắt đầu</button>
              </div>
              <div class="nutdieukhien">
                <button id="nutKetThuc" disabled>Kết thúc</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- khu vực thông tin menu -->
  </body>
  <script src="main.js"></script>
</html>
